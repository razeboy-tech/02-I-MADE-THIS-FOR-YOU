<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>02: I Made This For You ♡</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #fceef4;
      font-family: Georgia, serif;
      color: #51465a;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .phone {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      padding: 28px 22px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 15% 15%, #fff8c9 0 4%, transparent 5%),
        radial-gradient(circle at 85% 20%, #dcefff 0 5%, transparent 6%),
        linear-gradient(160deg, #fff4f7, #edf7ff 55%, #f5efff);
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    .cloud {
      position: absolute;
      width: 110px;
      height: 45px;
      background: rgba(255,255,255,.65);
      border-radius: 50px;
      filter: blur(1px);
    }

    .cloud.one {
      top: 80px;
      left: -35px;
    }

    .cloud.two {
      bottom: 100px;
      right: -40px;
    }

    .star {
      position: absolute;
      font-size: 22px;
      animation: float 3s ease-in-out infinite;
    }

    .s1 { top: 18%; left: 12%; }
    .s2 { top: 28%; right: 12%; animation-delay: .7s; }
    .s3 { bottom: 23%; left: 18%; animation-delay: 1.2s; }
    .s4 { bottom: 14%; right: 18%; animation-delay: .4s; }

    @keyframes float {
      0%,100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(8deg); }
    }

    .cat {
      font-size: 58px;
      margin-bottom: 12px;
      animation: bounce 2.5s ease-in-out infinite;
    }

    @keyframes bounce {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    .number {
      font-size: 15px;
      letter-spacing: 5px;
      color: #a486a8;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.08;
      letter-spacing: 1px;
      color: #55465d;
    }

    .subtitle {
      margin: 18px auto 8px;
      max-width: 290px;
      font-size: 16px;
      line-height: 1.6;
      color: #756879;
    }

    .tiny {
      font-size: 13px;
      color: #a18d9e;
      margin-bottom: 28px;
    }

    button {
      border: 0;
      background: #f4a9bd;
      color: white;
      font-family: inherit;
      font-size: 16px;
      padding: 13px 30px;
      border-radius: 30px;
      box-shadow: 0 6px 16px rgba(180, 120, 145, .18);
      cursor: pointer;
      transition: .2s;
    }

    button:active {
      transform: scale(.95);
    }

    .hidden {
      display: none;
    }

    .message {
      margin-top: 24px;
      font-size: 14px;
      color: #8b7484;
    }
  </style>
</head>

<body>

  <main class="phone">

    <div class="cloud one"></div>
    <div class="cloud two"></div>

    <div class="star s1">✦</div>
    <div class="star s2">♡</div>
    <div class="star s3">☆</div>
    <div class="star s4">✧</div>

    <div class="cat">૮ ˶ᵔ ᵕ ᵔ˶ ა</div>

    <div class="number">02</div>

    <h1>I MADE THIS<br>FOR YOU</h1>

    <p class="subtitle">
      A little something for you,<br>
      made with a little bit of love.
    </p>

    <p class="tiny">
      take your time, babe ♡
    </p>

    <button onclick="startGame()">
      ENTER ♡
    </button>

    <p id="after" class="message hidden">
      okay... let's begin. ♡
    </p>

  </main>

  <script>
    function startGame() {
      document.querySelector("button").style.display = "none";
      document.querySelector("#after").classList.remove("hidden");

      setTimeout(() => {
        alert("The little journey begins... ♡");
      }, 500);
    }
  </script>

</body>
  </html>
