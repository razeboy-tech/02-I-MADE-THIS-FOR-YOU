<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy 2nd Monthsary ♡</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #fceef4;
      font-family: Georgia, serif;
      color: #51465a;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .phone {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      padding: 28px 22px;
      position: relative;
      overflow: hidden;

      background:
        radial-gradient(circle at 15% 15%, #fff8c9 0 4%, transparent 5%),
        radial-gradient(circle at 85% 20%, #dcefff 0 5%, transparent 6%),
        linear-gradient(160deg, #fff4f7, #edf7ff 55%, #f5efff);

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    /* soft clouds */

    .cloud {
      position: absolute;
      width: 110px;
      height: 45px;
      background: rgba(255,255,255,.65);
      border-radius: 50px;
      filter: blur(1px);
    }

    .cloud.one {
      top: 80px;
      left: -35px;
    }

    .cloud.two {
      bottom: 100px;
      right: -40px;
    }

    /* floating decorations */

    .star {
      position: absolute;
      font-size: 22px;
      animation: float 3s ease-in-out infinite;
    }

    .s1 {
      top: 18%;
      left: 12%;
    }

    .s2 {
      top: 28%;
      right: 12%;
      animation-delay: .7s;
    }

    .s3 {
      bottom: 23%;
      left: 18%;
      animation-delay: 1.2s;
    }

    .s4 {
      bottom: 14%;
      right: 18%;
      animation-delay: .4s;
    }

    @keyframes float {
      0%,100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-8px) rotate(8deg);
      }
    }

    /* main title */

    .title {
      margin: 0;
      font-size: 34px;
      line-height: 1.1;
      letter-spacing: .5px;
      color: #55465d;
    }

    .made {
      margin-top: 12px;
      font-size: 14px;
      letter-spacing: 3px;
      color: #a486a8;
    }

    .divider {
      width: 45px;
      height: 1px;
      background: #cdb8c9;
      margin: 25px auto 18px;
    }

    .from {
      font-size: 14px;
      letter-spacing: 3px;
      color: #756879;
      margin-bottom: 7px;
    }

    .date {
      font-size: 12px;
      letter-spacing: 3px;
      color: #a18d9e;
    }

    /* button */

    button {
      margin-top: 38px;
      border: 0;
      background: #f4a9bd;
      color: white;
      font-family: inherit;
      font-size: 15px;
      letter-spacing: 1px;
      padding: 13px 30px;
      border-radius: 30px;
      box-shadow: 0 6px 16px rgba(180, 120, 145, .18);
      cursor: pointer;
      transition: .2s ease;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:active {
      transform: scale(.95);
    }

    /* second screen */

    .welcome {
      display: none;
      animation: fadeIn .8s ease forwards;
    }

    .welcome-number {
      font-size: 15px;
      letter-spacing: 5px;
      color: #a486a8;
      margin-bottom: 18px;
    }

    .welcome-title {
      font-size: 27px;
      line-height: 1.3;
      color: #55465d;
      margin: 0;
    }

    .welcome-text {
      margin: 20px auto 0;
      max-width: 290px;
      font-size: 15px;
      line-height: 1.7;
      color: #756879;
    }

    .enter {
      margin-top: 28px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <main class="phone">

    <div class="cloud one"></div>
    <div class="cloud two"></div>

    <div class="star s1">✦</div>
    <div class="star s2">♡</div>
    <div class="star s3">☆</div>
    <div class="star s4">✧</div>


    <!-- OPENING -->

    <section id="opening">

      <h1 class="title">
        Happy 2nd Monthsary
      </h1>

      <div class="made">
        I MADE THIS FOR YOU
      </div>

      <div class="divider"></div>

      <div class="from">
        BRIAN to JEAN
      </div>

      <div class="date">
        13.09.26
      </div>

      <button onclick="openWelcome()">
        OPEN ♡
      </button>

    </section>


    <!-- WELCOME -->

    <section id="welcome" class="welcome">

      <div class="welcome-number">
        01 — WELCOME
      </div>

      <h2 class="welcome-title">
        I made a little<br>
        something for you sayang.
      </h2>

      <p class="welcome-text">
        It's not much haha.<br>
        Just a few things I wanted you to find.
      </p>

      <button class="enter" onclick="enterRoom()">
        ENTER ♡
      </button>

    </section>

  </main>


  <script>

    function openWelcome() {

      document.getElementById("opening").style.display = "none";

      const welcome = document.getElementById("welcome");

      welcome.style.display = "block";

    }


    function enterRoom() {

      alert("Our little place is waiting... ♡");

    }

  </script>

</body>
</html>
